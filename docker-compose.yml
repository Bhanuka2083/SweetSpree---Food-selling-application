# docker-compose.yml
# version: '4.74.0'

services:
  db:
    image: mysql:8.0
    container_name: sweetspree_mysql
    restart: always
    environment:
      MYSQL_DATABASE: sweetspree
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: sweetspree_user
      MYSQL_PASSWORD: securepassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: sweetspree_django
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=sweetspree
      - DB_USER=sweetspree_user
      - DB_PASS=securepassword
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: sweetspree_react
    command: npm start
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  db_data: